[project.scripts]
mcp-tool-suite = "mcp_tool_suite.server:main"
mcp-tool-suite-eval = "evals.run:main"
[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-tool-suite"
version = "0.1.1"
description = "A multi-tool MCP server platform: one remote server, many AI-callable tools, pluggable into Claude, ChatGPT, VS Code and more."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Aanand" }]
dependencies = [
    "fastapi==0.143.0",
    "uvicorn[standard]==0.54.0",
    "mcp==2.3.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.15.0",
    "httpx==0.28.1",
    "pypdf==6.20.1",
    "numpy==2.4.6",
    "python-dotenv==1.2.4",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.0"]
pgvector = ["psycopg[binary]>=3.2", "pgvector>=0.3"]


[tool.setuptools.packages.find]
where = ["src", "."]
include = ["mcp_tool_suite*", "evals*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["dist", "build"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]


